/* Layout: una sola columna centrada, como un sitio de juegos Flash de 2003: todo centrado en ancho y alto: logo de Milo, el "reproductor" enmarcado y debajo los controles. Solo blanco y negro, sin grises. */
:root{
  --bg:#000; --panel:#000; --ink:#fff; --muted:#fff; --accent:#fff; --line:#fff; --bevel:#fff;
  --type:"Bookman Light","Bookman Old Style","URW Bookman",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--type);font-size:16px;line-height:1.4}
.wrap{box-sizing:border-box;min-height:100%;max-width:1274px;margin:0 auto;padding-block:20px;padding-inline:16px;display:flex;flex-direction:column;justify-content:center;gap:14px}
header{display:flex;justify-content:center;text-align:center}
h1{margin:0;line-height:0;width:100%;display:flex;justify-content:center}
h1 img{display:block;width:min(600px,100%);height:auto}
.player{background:var(--panel);border:2px solid var(--bevel);padding:6px}
.player .bar{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;padding:0 4px 6px;gap:8px;flex-wrap:wrap}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:#fff;outline:none;cursor:pointer}
canvas:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;color:var(--muted);font-size:15px}
kbd{font-family:var(--type);color:var(--ink);border:1px solid var(--line);border-bottom-width:3px;padding:0 6px;border-radius:3px;background:var(--panel)}
.pad{display:none;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad .grp{display:flex;gap:10px}
.pad{column-gap:40px}
.pad button{font-family:var(--type);font-size:20px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;width:64px;height:64px;touch-action:none}
.pad button:active{background:var(--ink);color:var(--bg)}
.pad button.wide{width:auto;padding:0 12px}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mute{font-family:var(--type);font-size:14px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:3px;cursor:pointer;padding:0 6px}
</style>

// música: clips de 20 s (con fade out) de la carpeta MUSICAS. Parte al empezar a jugar y, cuando termina
// un clip, sigue otro al azar distinto del anterior. Se usa un solo elemento de audio: así Safari lo deja
// seguir sonando después del primer toque.
const SONGS=['musica/good.mp4','musica/hope.mp4','musica/one.mp4','musica/silly.mp4'];
let song=null,lastSong=-1,songErr=0;
function nextSong(){
  let i;do i=Math.floor(Math.random()*SONGS.length);while(SONGS.length>1&&i===lastSong);
  lastSong=i;song.src=SONGS[i];song.muted=muted;
  const p=song.play();if(p)p.catch(()=>{});
}
function playSong(){
  try{
    if(!song){song=new Audio();song.volume=.7;song.addEventListener('ended',nextSong);song.addEventListener('error',()=>{if(++songErr<5)setTimeout(nextSong,500)});song.addEventListener('playing',()=>songErr=0)}
    if(song.src&&!song.paused&&!song.ended)return; // ya está sonando: no se corta al reintentar
    nextSong();
  }catch(e){}
}

// Enemigo 1: espera con los brazos cruzados, camina hacia Milo, le lanza monedas con un chasquido y a veces salta
function updPoser(e,dir){
  const d=Math.abs(P.x-e.x);
  if(!e.mode){e.mode='idle';e.mt=0;e.cd=60;e.step=0}
  e.mt++;if(e.cd>0)e.cd--;
  if(e.knock)e.x+=e.knock;
  switch(e.mode){
    case 'idle':if(d<260){e.mode='walk';e.mt=0}break;
    case 'walk':e.x+=dir*.65;e.step++;
      if(d<170&&d>60&&e.cd<=0){e.mode='flick';e.mt=0}
      else if(e.t%220===110){e.mode='crouch';e.mt=0}
      break;
    case 'flick':if(e.mt===12){eshots.push({x:e.x+e.w/2+dir*16,y:e.y+21,w:5,h:5,vx:dir*3,vy:-1.2,g:.06,k:'coin'});sfx('throw')}
      if(e.mt>34){e.mode='walk';e.cd=140}break;
    case 'crouch':if(e.mt>8){e.vy=-5.5;e.mode='jump';e.mt=0}break;
    case 'jump':e.x+=dir*1.1;break;
    case 'land':if(e.mt>10)e.mode='walk';break;
    case 'point':if(e.mt>50)e.mode='walk';break;
  }
  if(e.mode==='jump'){e.vy+=.35;e.y+=e.vy;if(e.y>=GROUND-e.h){e.y=GROUND-e.h;e.vy=0;e.mode='land';e.mt=0}}
}
// Enemigo 2: camina y corre hacia Milo, pega puñetazos y patadas de cerca y a veces salta (no lanza la mochila)
function updSilly(e,dir){
  const d=Math.abs(P.x-e.x),near=Math.abs((P.y+P.h)-(e.y+e.h))<30;
  if(!e.mode){e.mode='idle';e.mt=0;e.cd=0;e.bagCd=90;e.step=0;e.combo=0}
  e.mt++;if(e.cd>0)e.cd--;if(e.bagCd>0)e.bagCd--;
  if(e.knock)e.x+=e.knock;
  const strike=(reach)=>{if(d<reach&&near&&P.inv<=0){hurt(e.x);e.mode='cheer';e.mt=0;say(e.x-6,e.y-8,'take that!')}};
  switch(e.mode){
    case 'idle':if(d<280){e.mode='walk';e.mt=0}break;
    case 'walk':case 'run':{
      e.mode=d<190?'run':'walk';e.x+=dir*(e.mode==='run'?1.6:.8);e.step++;
      if(d<34&&e.cd<=0){e.mode=e.combo++%2?'kick':'punch';e.mt=0}
      else if(e.t%240===120){e.mode='jump';e.mt=0;e.vy=-6}
      break}
    case 'punch':if(e.mt===7)strike(40);if(e.mt>18&&e.mode==='punch'){e.mode='walk';e.cd=50}break;
    case 'kick':if(e.mt===8)strike(46);if(e.mt>20&&e.mode==='kick'){e.mode='walk';e.cd=60}break;
    case 'throw':if(e.mt===10){eshots.push({x:e.x+e.w/2+dir*14,y:e.y+14,w:12,h:10,vx:dir*3.2,vy:-3,g:.15,k:'bag',f:dir});sfx('throw')}
      if(e.mt>26){e.mode='walk';e.bagCd=260}break;
    case 'jump':e.x+=dir*1.4;break;
    case 'land':if(e.mt>8)e.mode='walk';break;
    case 'hurt':if(e.mt>14)e.mode='walk';break;
    case 'cheer':if(e.mt>45)e.mode='walk';break;
  }
  if(e.mode==='jump'){e.vy+=.35;e.y+=e.vy;if(e.y>=GROUND-e.h){e.y=GROUND-e.h;e.vy=0;e.mode='land';e.mt=0}}
}
// Enemigo 3: espera, toma impulso y embiste a toda velocidad; si se pasa de largo, frena y vuelve a cargar
function updJock(e,dir){
  const d=Math.abs(P.x-e.x);
  if(!e.mode){e.mode='wait';e.mt=0;e.step=0;e.face=dir}
  e.mt++;if(e.knock)e.x+=e.knock;
  switch(e.mode){
    case 'wait':e.face=dir;if(d<240){e.mode='windup';e.mt=0}break;
    case 'windup':e.face=dir;e.step++;if(e.mt>22){e.mode='charge';e.mt=0;e.cdir=dir}break;
    case 'charge':{
      e.face=e.cdir;e.step++;e.x+=e.cdir*3.2;
      const past=(P.x-e.x)*e.cdir<-70,out=e.x<cam+4||e.x>cam+W-e.w-4;
      if(past||out||e.mt>150){e.mode='brake';e.mt=0}
      break}
    case 'brake':e.x+=e.cdir*Math.max(0,3.2-e.mt*.15);if(e.mt%2)e.step++;if(e.mt>34){e.mode='windup';e.mt=0}break;
  }
}
function hurt(from){
  if(P.inv>0)return;
  P.hp=Math.max(0,P.hp-.5);P.inv=80; // cada golpe quita medio corazón
  P.vy=-3.2;P.vx=(P.x<from?-1:1)*2.5;angst=Math.min(100,angst+15);shake=10;sfx('hurt');
  say(P.x-10,P.y-8,['ouch, my heart','this hurts more than my diary','why me?'][Math.round(P.hp*2)%3]);
  if(P.hp<=0){state='dead';}
}
function damageEnemy(e,d){
  e.hp-=d;e.flash=8;e.knock=(e.x<P.x?-1:1)*2.2;sfx('hit');
  if(e.type==='fan'&&e.hp>0&&e.mode!=='jump'){e.mode='hurt';e.mt=0}
  if(e.hp<=0&&!e.dead){e.dead=true;kills++;say(e.x-20,e.y-10,ETYPE[e.type].bye)}
}
function damageBoss(d){
  if(!boss.active||boss.dead)return;
  boss.hp-=d;boss.flash=8;sfx('hit');
  if(boss.hp<=0){boss.dead=true;boss.active=false;sfx('win');banner={t:'THE BULLY: Ow! My bat!',life:160};kills+=5;eshots=[]}
}

function update(){
  frame++;
  if(state!=='play'){
    if(pressed('throw')||pressed('jump')){
      if(state==='title'){state='intro';dialog=0}
      else if(state==='intro'){dialog++;if(dialog>=INTRO.length)state='play'}
      else if(state==='dead'||state==='win'){reset();state='play'}
    }
    return;
  }
  // jugador
  let ax=(keys.left?-1:0)+(keys.right?1:0);
  if(P.inv>60)P.vx*=.9;else P.vx=ax*1.9;
  if(ax)P.face=ax;
  if(pressed('jump')&&P.onGround){P.vy=-7.2;P.onGround=false;sfx('jump')}
  P.vy=Math.min(8,P.vy+.35);
  const prevB=P.y+P.h;
  const minX=boss.active?ARENA+2:Math.max(0,cam);
  P.x=clamp(P.x+P.vx,minX,LEVEL-P.w-4);
  const wasAir=!P.onGround,fallV=P.vy;
  P.y+=P.vy;P.onGround=false;
  if(P.y+P.h>=GROUND){P.y=GROUND-P.h;P.vy=0;P.onGround=true}
  for(const pl of PLATS)if(P.vy>=0&&prevB<=pl.y+.5&&P.y+P.h>=pl.y&&P.x+P.w>pl.x+2&&P.x<pl.x+pl.w-2){P.y=pl.y-P.h;P.vy=0;P.onGround=true}
  if(P.onGround&&wasAir&&fallV>2)P.land=11;
  if(ax&&P.onGround)P.walk++;
  if(P.inv>0)P.inv--;if(P.cd>0)P.cd--;if(P.land>0)P.land--;
  if(pressed('throw')&&P.cd<=0){P.cd=20;P.thr=1;P.thrAir=!P.onGround}
  if(P.thr>0){
    P.thr++;
    if(P.thr===(P.thrAir?7:11)){recs.push({x:P.x+(P.face>0?P.w+6:-14),y:P.y+19,w:8,h:8,vx:P.face*5.2,life:75,rot:0});sfx('throw')}
    if(P.thr>(P.thrAir?15:29))P.thr=0;
  }
  if(pressed('scream')&&angst>=100){
    angst=0;shock={x:P.x+P.w/2,y:P.y+14,r:0};shake=22;sfx('scream');say(P.x-40,P.y-14,'IT’S NOT A PHASE, MOM!');
    enemies.forEach(e=>{if(e.x>cam-10&&e.x<cam+W+10)damageEnemy(e,3)});damageBoss(5);eshots=[];
  }else if(pressed('scream')){say(P.x-30,P.y-10,'not enough angst...')}

  // cámara
  const target=boss.active?ARENA:clamp(P.x-180,0,LEVEL-W);
  cam+= (target-cam)*.12;
  if(!boss.active&&!boss.dead&&P.x>ARENA+40){boss.active=true;sfx('boss');banner={t:'THE BULLY: Welcome to college, nerd!',life:170}}

  // aparición de enemigos
  while(spawnIdx<SPAWNS.length&&SPAWNS[spawnIdx][0]<cam+W+30){
    const [x,type]=SPAWNS[spawnIdx++],T=ETYPE[type];
    enemies.push({x,y:GROUND-T.h,w:T.w,h:T.h,type,hp:T.hp,vy:0,t:0,flash:0,knock:0,dead:false,deadT:0});
  }
  for(const e of enemies){
    if(e.dead){e.deadT++;if(e.type!=='fan')e.y+=e.deadT*.25;continue}
    const T=ETYPE[e.type];e.t++;
    const dir=Math.sign(P.x-e.x)||1;
    if(e.type==='poser')updPoser(e,dir);else if(e.type==='fan')updSilly(e,dir);else updJock(e,dir);
    e.knock*=.8;if(Math.abs(e.knock)<.1)e.knock=0;
    if(e.flash>0)e.flash--;
    if(e.type!=='fan'&&hit(P,e)){const fresh=P.inv<=0;hurt(e.x);if(fresh&&e.type==='poser'){e.mode='point';e.mt=0;say(e.x-14,e.y-8,'haha, so emo')}
      if(fresh&&e.type==='exec')say(e.x-16,e.y-8,'TOUCHDOWN!')}
  }
  enemies=enemies.filter(e=>!(e.dead&&e.deadT>(e.type==='fan'?110:40))&&e.x>cam-200);

  // jefe
  if(boss.active){
    boss.t++;if(boss.flash>0)boss.flash--;
    // jefe final (carpeta ENEMIGO FINAL): camina hacia Milo y, de cerca, le da con el bate de clavos
    const bdx=(P.x+P.w/2)-(boss.x+boss.w/2),bd=Math.abs(bdx),angry=boss.hp<15;
    if(boss.cd>0)boss.cd--;
    if(boss.mode==='swing'){
      boss.mt++;
      if(boss.mt===16){sfx('hit');if(bd<84&&Math.sign(bdx)===boss.face&&P.y+P.h>boss.y+10){hurt(boss.x);shake=12;say(boss.x-10,boss.y-8,'BONK!')}}
      if(boss.mt>=32){boss.mode='walk';boss.cd=angry?40:70}
    }else{
      boss.face=Math.sign(bdx)||boss.face;
      if(bd<64&&boss.cd<=0){boss.mode='swing';boss.mt=0}
      else if(bd>30){boss.x+=boss.face*(angry?1.3:.8);boss.step++}
    }
    boss.x=clamp(boss.x,ARENA+20,ARENA+W-boss.w-10);
    if(boss.t%320===0&&enemies.filter(e=>!e.dead).length<2){const T=ETYPE.poser;enemies.push({x:ARENA+W-10,y:GROUND-T.h,w:T.w,h:T.h,type:'poser',hp:T.hp,vy:0,t:0,flash:0,knock:0,dead:false,deadT:0,mode:'walk',mt:0,cd:60,step:0})}
    if(hit(P,boss))hurt(boss.x);
  }
  if(boss.dead){winT++;if(winT>70){state='win';sfx('win')}} // tras el parpadeo del jefe, directo al final

  // proyectiles
  for(const r of recs){r.x+=r.vx;r.life--;r.rot+=.4;
    for(const e of enemies)if(!e.dead&&hit(r,e)){damageEnemy(e,1);r.life=0;break}
    if(r.life>0&&boss.active&&hit(r,boss)){damageBoss(1);r.life=0}
  }
  recs=recs.filter(r=>r.life>0);
  for(const s of eshots){s.vy+=s.g;s.x+=s.vx;s.y+=s.vy;if(hit(P,s)){hurt(s.x);s.dead=true}if(s.y>GROUND)s.dead=true}
  eshots=eshots.filter(s=>!s.dead&&s.x>cam-40&&s.x<cam+W+40);

  // recolectables
  for(const p of picks)if(!p.got&&hit(P,p)){
    p.got=true;sfx('pick');
    if(p.k==='pua')picksGot++;
    if(p.k==='letra'){angst=Math.min(100,angst+35);say(p.x-24,p.y-8,'+ sad lyrics')}
    if(p.k==='cafe'){P.hp=Math.min(5,P.hp+1);say(p.x-20,p.y-8,'black coffee, like my soul')}
  }
  angst=Math.min(100,angst+.012);
  for(const t of texts){t.y-=.4;t.life--}texts=texts.filter(t=>t.life>0);
  if(banner&&--banner.life<=0)banner=null;
  if(shock){shock.r+=9;if(shock.r>520)shock=null}
  if(shake>0)shake--;
}

// Todo en blanco y negro puro: sin grises, sin transparencias y sin bordes suavizados.
// colores del juego: tinta negra sobre papel blanco, como los dibujos originales (sin grises)
const INK='#000',PAPER='#fff';
function r(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),w,h)}
function box(x,y,w,h){r(x,y,w,h,INK);r(x+1,y+1,w-2,h-2,PAPER)} // rectángulo blanco con borde negro
function circ(cx,cy,rad,c){for(let dy=-rad;dy<=rad;dy++){const w=Math.floor(Math.sqrt(rad*rad-dy*dy));r(cx-w,cy+dy,w*2+1,1,c)}}
// Sprites en línea, como el dibujo de Milo: partes 'W' rellenas de blanco con contorno negro,
// partes 'K' negras, y un halo blanco alrededor para que se lean sobre el fondo negro.
function lineSprite(x,y,w,face,parts,flash){
  const at=(lx,pw)=>face>0?x+lx:x+w-lx-pw;
  for(const [lx,ly,pw,ph] of parts)r(at(lx,pw)-2,y+ly-2,pw+4,ph+4,PAPER);
  if(flash)return;
  for(const [lx,ly,pw,ph] of parts)r(at(lx,pw)-1,y+ly-1,pw+2,ph+2,INK);
  for(const [lx,ly,pw,ph,c] of parts){const px=at(lx,pw);if(c==='W'){r(px-1,y+ly-1,pw+2,ph+2,INK);r(px,y+ly,pw,ph,PAPER)}else r(px,y+ly,pw,ph,INK)}
}
function miloFrame(){
  const moving=keys.left||keys.right;
  if(P.thr>0&&P.thrAir)return MF.athrow[[2,3,4,5,6][Math.min(4,Math.floor(P.thr/3))]];
  const ti=2+Math.floor((P.thr-1)/2); // lanzamiento en el suelo: fotogramas 3 a 16, suelta el disco en el 8
  if(P.thr>0&&P.onGround&&!(moving&&ti>=11))return MF.throw[Math.min(15,ti)];
  if(!P.onGround){const v=P.vy;return MF.jump[v<-4.5?4:v<-2?5:v<0?6:v<1.5?7:v<4?8:9]}
  if(moving)return MF.run[Math.floor(P.walk/2)%24];
  if(P.land>0)return MF.jump[[21,21,19,17,15,13][Math.floor(P.land/2)]];
  return MF.jump[21]; // de pie: el último fotograma de la hoja sale demasiado estirado
}

function poserFrame(e){
  switch(e.mode){
    case 'walk':return E1F.walk[Math.floor(e.step/7)%6];
    case 'flick':return E1F.flick;
    case 'point':return E1F.point;
    case 'crouch':return E1F.jump[0];
    case 'jump':return E1F.jump[1];
    case 'land':return E1F.jump[2];
    default:{const mt=e.mt||0;return mt%200>150?E1F.glasses:E1F.idle[Math.floor(mt/14)%4]}
  }
}
function sillyFrame(e){
  const A=E2A;
  if(e.dead)return E2F[e.deadT<36?A.ko[Math.floor(e.deadT/9)]:A.ko[3]];
  switch(e.mode){
    case 'walk':return E2F[A.walk[Math.floor(e.step/7)%6]];
    case 'run':return E2F[A.run[Math.floor(e.step/5)%4]];
    case 'punch':return E2F[A.punch[Math.min(2,Math.floor(e.mt/6))]];
    case 'kick':return E2F[A.kick[Math.min(2,Math.floor(e.mt/7))]];

  }

function drawE(img,f,x,y,flip){

function drawEnemy(e){

    drawE(E3,jockFrame(e),e.x+e.w/2,e.y+e.h,(e.face||1)<0);return;
  }
  if(e.type==='fan'){
    if(!E2.complete||!E2.naturalWidth)return;

// triángulo relleno por filas de píxeles, para que el borde no tenga grises
function tri(ax,ay,bx,by,cx,cy,c){
  const y0=Math.round(Math.min(ay,by,cy)),y1=Math.round(Math.max(ay,by,cy));
  for(let y=y0;y<=y1;y++){let lo=1e9,hi=-1e9;
    for(const [px,py,qx,qy] of [[ax,ay,bx,by],[bx,by,cx,cy],[cx,cy,ax,ay]]){
      if((y-py)*(y-qy)<=0&&py!==qy){const x=px+(qx-px)*(y-py)/(qy-py);lo=Math.min(lo,x);hi=Math.max(hi,x)}}
    if(hi>=lo)r(Math.round(lo),y,Math.max(1,Math.round(hi)-Math.round(lo)),1,c)}
}
// globo de diálogo de cómic: blanco con borde negro y una cola hacia quien habla (tx,ty)
function bubble(x,y,w,h,tx,ty,text){
  r(x,y,w,h,INK);
  if(tx<x||tx>x+w){ // cola hacia un costado
    const by=clamp(ty,y+14,y+h-14),ex=tx<x?x+2:x+w-2,dx=tx<x?4:-4;
    tri(ex,by-10,ex,by+10,tx,ty,INK);r(x+2,y+2,w-4,h-4,PAPER);tri(ex,by-7,ex,by+7,tx+dx,ty,PAPER);
  }else{ // cola hacia arriba o abajo
    const bx=clamp(tx,x+16,x+w-16),below=ty>y+h,ey=below?y+h-2:y+2;
    tri(bx-10,ey,bx+10,ey,tx,ty,INK);r(x+2,y+2,w-4,h-4,PAPER);tri(bx-7,ey,bx+7,ey,tx+(bx-tx)*.12,ty+(below?-4:4),PAPER);
  }
  X.textAlign='center';X.font='14px '+FONT;X.fillStyle=INK;
  const lines=Math.max(1,Math.ceil(X.measureText(text).width/(w-20)));
  wrap(text,x+w/2,y+h/2+5-(lines-1)*9,w-20,18);
}
function wrap(t,x,y,maxW,lh){const words=t.split(' ');let line='';for(const w of words){const test=line+w+' ';if(X.measureText(test).width>maxW&&line){X.fillText(line,x,y);line=w+' ';y+=lh}else line=test}X.fillText(line,x,y)}

    if(sc.img==='band'){
      const im=Math.floor(frame/12)%2?IN2:IN1; // las dos imágenes se alternan: la banda celebrando
      if(im.complete&&im.naturalWidth)X.drawImage(im,Math.round((W-im.width/3)/2),H-im.height/3,im.width/3,im.height/3);
      bubble(150,12,180,40,262,92,sc.say);
    }else{
      if(COLLEGE.complete&&COLLEGE.naturalWidth)X.drawImage(COLLEGE,40,H-COLLEGE.height/3,COLLEGE.width/3,COLLEGE.height/3);
      bubble(262,70,190,56,212,128,sc.say);
    }
    X.textAlign='right';X.font='11px '+FONT;X.fillStyle=INK;X.fillText((dialog+1)+'/'+INTRO.length+'  ·  X to continue',W-10,18);
  }else if(state==='dead'){
    r(0,0,W,H,PAPER);
    X.font='28px '+DFONT;X.fillStyle=INK;X.fillText('They broke your heart',W/2,110);
    X.font='13px '+FONT;wrap('College will have to wait. Write a poem and try again.',W/2,140,380,18);
    X.font='14px '+FONT;X.fillText('X to try again',W/2,200);
  }else if(state==='win'){
    const score=picksGot*10+kills*50+P.hp*100;
    r(0,0,W,H,PAPER);
    X.font='28px '+DFONT;X.fillStyle=INK;X.fillText('You got into College!',W/2,110);
    X.font='13px '+FONT;X.fillText('flasks '+picksGot+' · defeated '+kills+' · hearts '+P.hp,W/2,160);
    X.font='20px '+FONT;X.fillText('Score '+score,W/2,192);
    X.font='14px '+FONT;X.fillText('X to play again',W/2,230);
  }
  X.textAlign='left';
}
function draw(){
  X.setTransform(3,0,0,3,0,0);
  X.save();
  if(shake>0&&!RM)X.translate(Math.round((Math.random()-.5)*shake*.6),Math.round((Math.random()-.5)*shake*.6));
  drawWorld();
  if(state==='play')drawHUD();
  X.restore();
  overlay();
}

// ---------- bucle ----------
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();for(const k in just)just[k]=false;acc-=1000/60}
  draw();requestAnimationFrame(loop);
}
Promise.race([Promise.all([document.fonts.load('16px "Bookman Light"')]),new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).finally(()=>{C.focus({preventScroll:true});requestAnimationFrame(loop)});
})();
</script>
